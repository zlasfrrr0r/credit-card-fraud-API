name: CI/CD Pipeline

on:
    push:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build Container
              run: |
                docker compose up -d --build
                sleep 12
              
            - name: Run Integration Test
              run: |
                docker compose exec -T web1 pytest --verbose -W ignore::DeprecationWarning

            - name: Clean up Container
              if: always()
              run: docker compose down
    
    build-push:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Setup QEMU
              uses: docker/setup-qemu-action@v3

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push image
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/fraud-api:latest

    deploy:
        needs: [test, build-push]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Copy Compose Files to EC2
              uses: appleboy/scp-action@v0.1.7

              with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_SECRET_KEY }}
                source: "docker-compose.yml,nginx.conf,prometheus.yml,grafana/"
                target: "~/app"

            - name: Deploy to AWS EC2
              uses: appleboy/ssh-action@v1.0.3

              env:
                DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_HOST }}
                envs: DOCKER_USERNAME
                script: |
                  cd ~/app
                  sudo docker compose pull
                  sudo docker compose up -d --remove-orphans
                  sudo docker image prune -f